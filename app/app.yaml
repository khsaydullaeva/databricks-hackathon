command: ["streamlit", "run", "app.py"]
env:
  # Add a SQL warehouse resource to the app with resource key "sql-warehouse"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: FINDCARE_CATALOG
    value: workspace
  - name: FINDCARE_SCHEMA
    value: findcare
  - name: FINDCARE_LLM_ENDPOINT
    value: databricks-meta-llama-3-3-70b-instruct
  # Add an MLflow experiment resource with key "experiment" to log agent traces
  - name: FINDCARE_MLFLOW_EXPERIMENT
    valueFrom: experiment
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
